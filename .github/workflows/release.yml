name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager || true)"
          fi
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p out
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in
            v*) ;;
            *) VERSION="dev-${GITHUB_SHA::7}" ;;
          esac
          cp app/build/outputs/apk/debug/app-debug.apk "out/TorrentViewer-${VERSION}.apk"
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrentViewer-APK
          path: out/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          name: ${{ github.ref_name }}
          body: |
            ## 种子查看器 ${{ github.ref_name }}

            自动构建的 debug 签名 APK，可直接安装。

            - 包名：`com.torrentviewer.app`
            - 最低支持：Android 7.0（API 24）
            - 首次启动需授予「所有文件访问权限」
